name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Ensure Executable Gradle Wrapper
      run: chmod +x android/gradlew

    - name: Build APK
      working-directory: ./android
      run: ./gradlew assembleDebug --stacktrace

    - name: Prepare Direct APK for Release
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/abunem.apk
        mkdir -p public
        cp android/app/build/outputs/apk/debug/app-debug.apk public/abunem.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: abune-android-apk
        path: android/app/build/outputs/apk/debug/abunem.apk

    - name: Release Direct Downloadable APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Abunəm Latest Android Release"
        body: "Otomatik hazırlanan Abunəm Android APK faylı"
        draft: false
        prerelease: false
        files: android/app/build/outputs/apk/debug/abunem.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
