name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Ensure Executable Gradle Wrapper
      run: chmod +x android/gradlew

    - name: Build APK
      working-directory: ./android
      run: ./gradlew assembleDebug --stacktrace

    - name: Prepare Direct APK for Release
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/abunem.apk

    - name: Create Official GitHub Release via GH CLI
      run: |
        gh release delete v3.0.0 --yes || true
        git tag -d v3.0.0 || true
        git push --delete origin v3.0.0 || true
        gh release create v3.0.0 android/app/build/outputs/apk/debug/abunem.apk --title "Abunəm Mobile Official Release v3.0.0" --notes "Rəsmi Yenilənmiş Zipalign + Signed Abunəm Android APK"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
