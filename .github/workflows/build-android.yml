name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Ensure Executable Gradle Wrapper
      run: chmod +x android/gradlew

    - name: Build APK
      working-directory: ./android
      run: ./gradlew assembleDebug --stacktrace

    - name: Prepare and Auto-Commit Fresh APK to Repository
      run: |
        mkdir -p downloads
        cp android/app/build/outputs/apk/debug/app-debug.apk downloads/abunem.apk
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -f downloads/abunem.apk
        git commit -m "build(apk): auto-commit fresh compiled APK to downloads/abunem.apk [skip ci]" || echo "No changes"
        git push origin HEAD:main
