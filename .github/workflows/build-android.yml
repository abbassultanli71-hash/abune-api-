name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Ensure Executable Gradle Wrapper
      run: chmod +x android/gradlew

    - name: Build APK
      working-directory: ./android
      run: ./gradlew assembleDebug --stacktrace

    - name: Prepare Direct APK for Release
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/abunem.apk

    - name: Release Direct Downloadable APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v3.0.0
        target_commitish: ${{ github.sha }}
        name: "Abunəm Mobile Release v3.0.0"
        body: "Rəsmi Yenilənmiş Abunəm Android APK"
        draft: false
        prerelease: false
        files: android/app/build/outputs/apk/debug/abunem.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
