<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <rect width="120" height="120" rx="28" fill="url(#brandGrad)"/>

  <!-- the subscription: a single clean card -->
  <rect x="24" y="30" width="68" height="50" rx="11" fill="#ffffff"/>
  <rect x="35" y="46" width="32" height="6" rx="3" fill="#ea580c" fill-opacity="0.85"/>
  <rect x="35" y="58" width="20" height="6" rx="3" fill="#ea580c" fill-opacity="0.45"/>

  <!-- the renewal: a clock, sitting on the card's corner -->
  <circle cx="86" cy="76" r="20" fill="#ffffff" stroke="#ea580c" stroke-width="4"/>
  <path d="M86 65 L86 76 L94 81" stroke="#ea580c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
